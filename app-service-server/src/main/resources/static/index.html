<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>系统管理平台</title>
    <link rel="stylesheet" href="/css/app.css?v=20261125g">
</head>
<body>
<div class="container">
    <h1>系统管理平台</h1>
    <div class="toolbar">
        <input id="search" placeholder="搜索系统名称或环境">
        <select id="status">
            <option value="">全部状态</option>
            <option value="ONLINE">在线</option>
            <option value="OFFLINE">离线</option>
        </select>
        <button id="refresh">刷新</button>
        <button id="generateApp" class="secondary">生成空壳系统</button>
    </div>
    <table>
        <thead>
        <tr>
            <th>系统名称</th>
            <th>环境</th>
            <th>实例</th>
            <th>接口数</th>
            <th>最近心跳</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="appRows"></tbody>
    </table>
</div>
<div id="scaffoldModal" class="modal" style="display:none">
    <div class="modal-content">
        <h2>生成空壳业务系统</h2>
        <label>系统名称 <input id="scaffoldName" placeholder="demo-app"></label>
        <label>端口 <input id="scaffoldPort" type="number" value="18080"></label>
        <label>环境 <input id="scaffoldEnv" value="dev"></label>
        <p class="hint">生成的项目包含 /api/health，启动后会自动注册到当前管理端。</p>
        <pre id="scaffoldInfo" class="result"></pre>
        <div class="modal-actions">
            <button id="scaffoldClose" class="secondary">关闭</button>
            <button id="scaffoldSubmit">生成并下载</button>
        </div>
    </div>
</div>
<script src="/js/common.js?v=20261125a"></script>
<script src="/js/app.js?v=20261125g"></script>
</body>
</html>
