<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>系统详情</title>
    <link rel="stylesheet" href="/css/app.css?v=20261126a">
</head>
<body>
<div class="container">
    <a href="/">← 返回列表</a>

    <h2>实例列表</h2>
    <table>
        <thead>
        <tr>
            <th>实例标识</th>
            <th>地址</th>
            <th>主机名</th>
            <th>启动时间</th>
        </tr>
        </thead>
        <tbody id="instancesBody"></tbody>
    </table>

    <div class="tabs">
        <button id="tabInterfaces" class="tab active">接口列表</button>
        <button id="tabCases" class="tab">测试用例列表</button>
        <button id="tabTraffic" class="tab">流量录制</button>
    </div>
    <div id="mainSplit" class="split">
        <div class="left-panel">
            <div id="interfaces" class="interface-list"></div>
            <div id="caseToolbar" class="case-toolbar" style="display:none">
                <button id="replayAllCases">回放所有用例</button>
                <span id="replayAllStatus" class="muted"></span>
            </div>
            <div id="caseList" class="interface-list" style="display:none"></div>
        </div>
        <div id="interfaceDetail" class="card">
            <p class="muted">请选择一个接口或测试用例。</p>
        </div>
    </div>

    <div id="trafficPanel" class="traffic-panel" style="display:none">
        <div class="record-control">
            <span>录制状态：<strong id="trafficRecordStatus">-</strong></span>
            <input id="recordingStartAt" type="datetime-local" title="起始时间，为空表示立即开始">
            <button id="startRecording">开始录制</button>
            <button id="stopRecording" class="secondary">结束录制</button>
            <span class="muted">起始时间为空表示立即开始；设置未来时间则到点自动开始</span>
        </div>
        <div class="traffic-filter">
            <select id="trafficInterface"><option value="">全部接口</option></select>
            <select id="trafficMethod">
                <option value="">全部方法</option>
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="DELETE">DELETE</option>
            </select>
            <input id="trafficStatus" type="number" placeholder="状态码">
            <input id="trafficTraceId" placeholder="traceId">
            <input id="trafficStart" type="datetime-local" title="开始时间">
            <input id="trafficEnd" type="datetime-local" title="结束时间">
            <label><input id="trafficOnlyFailures" type="checkbox"> 只看失败</label>
            <button id="trafficQuery">查询</button>
            <button id="trafficReset" class="secondary">重置</button>
        </div>
        <table class="traffic-table">
            <thead>
            <tr>
                <th>时间</th><th>方法</th><th>路径</th><th>接口ID</th><th>状态</th>
                <th>结果</th><th>耗时</th><th>traceId</th><th>操作</th>
            </tr>
            </thead>
            <tbody id="trafficTableBody"></tbody>
        </table>
        <div id="trafficDetail" class="card">
            <p class="muted">请点击一行查看请求与响应详情。</p>
        </div>
        <div id="replayResult" class="response-box"></div>
    </div>
</div>
<script src="/js/common.js?v=20261126a"></script>
<script src="/js/test.js?v=20261126a"></script>
<script src="/js/traffic.js?v=20261126a"></script>
</body>
</html>
